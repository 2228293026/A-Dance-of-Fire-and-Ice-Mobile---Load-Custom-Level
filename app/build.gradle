// app 模块 build.gradle
apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    // AIDE 默认带 NDK；如需特定版本可在此设置（留空则用默认）
    // ndkVersion "21.1.6352462"

    defaultConfig {
        applicationId "com.adofai.mod"
        minSdkVersion 23      // 与 Application.mk 的 APP_PLATFORM=android-23 一致
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.3"

        // 指定使用现有的 ndk-build 工程（app/src/main/jni/Android.mk）
        externalNativeBuild {
            ndkBuild {
                arguments "-j4"
                // 如需强制单 ABI：
                // abiFilters "arm64-v8a"
            }
        }
        ndk {
            // 只构建 mod 需要的 ABI（原 Application.mk 只编 arm64-v8a）
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 无第三方依赖；mod 应避免引入 androidx（会被注入的游戏 APK 不携带）
}
